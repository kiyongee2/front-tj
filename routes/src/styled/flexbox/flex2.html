<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플렉스 예제</title>
  <style>
    .container{
      display: flex;
      justify-content: center;
      justify-content: flex-start;
      justify-content: flex-end;
      justify-content: space-between;
      gap: 10px;
    }
    .box{
      width: 50px;
      height: 50px;
      background-color: blue;
    }
  </style>

</head>
<body>
  <div class="container">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</body>
</html>
