<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM 예제</title>
</head>
<body>
  <h1 id="switch" onclick="changeText()">Click on this text!</h1>

  <script>
    function changeText(){
      document.getElementById("switch").style.color = "#ff0000";
    }
  </script>
</body>
</html>
