<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <style>
    .container {
      width: 400px;
      height: 300px;
      border: 1px solid #000;
      display: flex;
      align-items: center; /* 아이템을 세로 방향으로 중앙 정렬 */
      align-items: start; /* 아이템을 세로 방향으로 시작 위치에 정렬 */
      align-items: end; /* 아이템을 세로 방향으로 끝 위치에 정렬 */
      justify-content: space-around; /* 아이템을 가로 방향으로 고르게 분배 */
      /* justify-content: flex-start;  /* 아이템을 가로 방향으로 시작 위치에 정렬 */
      /* flex-direction: row-reverse; /* 아이템을 가로 방향으로 역순 배치 */
      gap: 16px; /* 아이템 사이의 간격 */
    }
    .box {
      width: 60px;
      height: 60px;
      background-color: skyblue;
    }
    p{text-align: center;}
  </style>
</head>
<body>
  <div class="container">
    <div class="box"><p>1</p></div>
    <div class="box"><p>2</p></div>
    <div class="box"><p>3</p></div>
    <div class="box"><p>4</p></div>
  </div>
</body>
</html>
