<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box1 {
      width: 200px;
      height: 100px;
      background-color: lightcoral;
      margin: 20px;
    }
    .box2 {
      /* width는 부모 요소의 너비에 대한 백분율로 지정 */
      width: 50%;
      height: 100px;
      background-color: lightseagreen;
      margin: 20px;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>
</html>
