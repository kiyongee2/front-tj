<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>패딩(Padding)</title>
  <style>
    div{
      width: 200px;
      background-color: lightcoral;
      margin: 20px;
      display: inline-block;
    }
    .box1{padding: 10px;}
    .box2{padding: 10px 30px;}
    .box3{padding: 10px 30px 10px 30px;}
  </style>
</head>
<body>
  <div class="box1">패딩(padding)이란 요소의 콘텐츠와 테두리 사이의 공간을 말한다.</div>
  <div class="box2">패딩(padding)이란 요소의 콘텐츠와 테두리 사이의 공간을 말한다.</div>
  <div class="box3">패딩(padding)이란 요소의 콘텐츠와 테두리 사이의 공간을 말한다.</div>
</body>
</html>
