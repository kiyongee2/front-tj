<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex 속성 예제</title>
  <style>
    #container {
      display: flex;
    }
    .box1 {
      width: 100px;
      height: 100px;
      background: #00f;
      margin: 10px;
    }
    .box2 {
      width: 100px;
      height: 100px;
      background: #0f0;
      margin: 10px;
    }
    .box3 {
      width: 100px;
      height: 100px;
      background: #f00;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
  </div>
</body>
</html>
