<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex 속성</title>
  <style>
    #container {
      display: flex;
      border: 1px solid #000;
      justify-content: flex-end;
    }
    .box {
      width: 100px;
      height: 100px;
      background-color: #007bff;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</body>
</html>
