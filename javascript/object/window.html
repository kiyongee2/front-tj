<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=h, initial-scale=1.0">
  <title>Window 객체 예제</title>
</head>
<body>
  <h2>Window 객체 예제</h2>

  <script>
    // 1초마다 실행되는 코드
    //window.setInterval() 또는 setInterval()로 사용
    setInterval(() => {
      console.log("1초마다 실행되는 코드");
    }, 1000);

    // 3초 후에 알림을 띄우는 코드
    setTimeout(() => {
      alert("3초가 지났습니다!");
    }, 3000);
    
  </script>
</body>
</html>
