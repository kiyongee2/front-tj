<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건문 - 다중 if문</title>
</head>
<body>
  <h2>조건문 - 다중 if문</h2>

  <script>
    let color = prompt("색상을 입력하세요 (red, yellow, green):");

    if (color === "red") {
      console.log("멈춤");
    } else if (color === "yellow") {
      console.log("준비");
    } else if (color === "green") {
      console.log("진행");
    } else {
      console.log("알 수 없는 색상입니다.");
    }
  </script>

</body>
</html>
