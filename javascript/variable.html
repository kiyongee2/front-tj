<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>자바스크립트 기초</h1>
  <p>자바스크립트는 웹 페이지를 동적으로 만들기 위해 사용

  <script>
    // 변수 선언과 자료형 예시
    var name = "Alice"; // 문자열
    let age = 30; // 숫자
    const isStudent = true; // 불리언, 상수

    console.log("Name:", name);
    console.log("Age:", age);
    console.log("Is Student:", isStudent);

    // 변수 재할당 예시
    name = "Bob";
    age = 25;
    console.log("Updated Name:", name);
    console.log("Updated Age:", age);

    isStudent = false; // 오류 발생: const로 선언된 변수는 재할당 불가
  </script>
</body>
</html>
