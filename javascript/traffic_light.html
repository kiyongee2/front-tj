<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신호등 색상 판별</title>
  <style>
    #result {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h2>신호등 색상 판별</h2>
  <div id="result"></div>
  <button onclick="checkColor()">판별하기</button>
  <script>
    const checkColor = () => {
      // 사용자로부터 신호등 색상 입력 받기
      let color = prompt("신호등 색상을 입력하세요 (빨강, 노랑, 초록):");
      const result = document.getElementById("result");

      if(color == null){
        result.textContent = "입력이 취소되었습니다.";
      } else {
        color = color.trim(); // 입력값 양쪽 공백 제거
        if (color === "빨강") {
          result.textContent = "멈춤";
          result.style.color = "red"; // 빨간색으로 표시
        } else if (color === "노랑") {
          result.textContent = "준비";
          result.style.color = "orange"; // 주황색으로 표시
        } else if (color === "초록") {
          result.textContent = "출발";
          result.style.color = "green"; // 초록색으로 표시
        } else {
          result.innerHTML = "유효하지 않은 색상입니다.<br> \
            빨강, 노랑, 초록 중 하나를 입력하세요.";
        }
      }
    }
  </script>
</body>
</html>
