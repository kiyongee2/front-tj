<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건문 - if문</title>
</head>
<body>
  <h2>조건문 - if문</h2>

  <script>
    //let age = 18;

    // 사용자로부터 나이 입력 받기
    let age = parseInt(prompt("나이를 입력하세요:"));
    console.log(typeof(age)); // number

    if (age >= 20) {
      console.log("성인입니다.");
    } else {
      console.log("미성년자입니다.");
    }

    console.log(`나이는 ${age}세입니다.`);
  </script>

</body>
</html>
